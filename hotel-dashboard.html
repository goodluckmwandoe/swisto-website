<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Dashboard - SWISTO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    
    <header class="dashboard-header">
        <a href="index.html" class="logo">
            <img src="swisto-logo.png" alt="SWISTO">
        </a>
        <div class="user-menu">
            <div class="user-avatar">HM</div>
            <div>
                <div style="font-weight: 600; font-size: 0.9rem;">Hotel Manager</div>
                <div style="font-size: 0.8rem; color: var(--gray);">Beachfront Resort</div>
            </div>
            <button class="logout-btn" onclick="localStorage.removeItem('swisto_user'); location.href='login.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <nav class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-plus-circle"></i> New Emergency</a></li>
                <li><a href="#"><i class="fas fa-list"></i> My Orders</a></li>
                <li><a href="#"><i class="fas fa-truck"></i> Suppliers</a></li>
                <li><a href="#"><i class="fas fa-boxes"></i> Inventory</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <h1 style="margin-bottom: 30px;">Emergency Procurement Dashboard</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Active Emergencies</h3>
                    <div class="value">3</div>
                </div>
                <div class="stat-card">
                    <h3>Pending Quotes</h3>
                    <div class="value">5</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Response Time</h3>
                    <div class="value">12 min</div>
                </div>
                <div class="stat-card">
                    <h3>Monthly Savings</h3>
                    <div class="value" style="color: var(--primary-light);">KSh 42,500</div>
                </div>
            </div>

            <div class="orders-section">
                <!-- Orders will be loaded here by the script below -->
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // YOUR FIREBASE CONFIG IS PASTED HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBdZ_tWHds0XjcAzA0XzM2DgejAtK-1YeQ",
            authDomain: "swisto-kenya.firebaseapp.com",
            projectId: "swisto-kenya",
            storageBucket: "swisto-kenya.firebasestorage.app",
            messagingSenderId: "328714398565",
            appId: "1:328714398565:web:1fb61ec84d64e774ad4f8c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const user = JSON.parse(localStorage.getItem('swisto_user'));
        if(!user) window.location.href = 'login.html';

        window.submitOrder = async function() {
            const items = prompt("What emergency items do you need?");
            if (!items) return;

            await addDoc(collection(db, "orders"), {
                hotelEmail: user.email,
                items: items,
                urgency: "urgent",
                status: "pending",
                timestamp: new Date()
            });
            
            alert("Order saved to Cloud Database!");
            window.location.reload();
        }

        async function loadOrders() {
            const querySnapshot = await getDocs(collection(db, "orders"));
            const container = document.querySelector('.orders-section');
            
            container.innerHTML = `
                <h2 class="section-title"><i class="fas fa-clock"></i> My Recent Orders</h2>
                <button class="btn btn-primary" onclick="submitOrder()" style="margin-bottom: 20px;">+ Create Test Order</button>
            `;
            
            let hasOrders = false;
            querySnapshot.forEach((doc) => {
                const order = doc.data();
                if (order.hotelEmail === user.email) {
                    hasOrders = true;
                    container.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <div class="order-id">Order #${doc.id.slice(-5)}</div>
                                <div class="status-${order.urgency}">${order.urgency.toUpperCase()}</div>
                            </div>
                            <p><strong>Items:</strong> ${order.items}</p>
                            <p><strong>Status:</strong> ${order.status}</p>
                        </div>
                    `;
                }
            });
            
            if(!hasOrders) {
                container.innerHTML += `<p style="color: #94a3b8;">No orders found. Click the button above to create one.</p>`;
            }
        }
        
        loadOrders();
    </script>
</body>
</html>
