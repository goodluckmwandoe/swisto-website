<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Dashboard - SWISTO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    
    <header class="dashboard-header">
        <a href="index.html" class="logo">
            <img src="swisto-logo.png" alt="SWISTO">
        </a>
        <div class="user-menu">
            <div class="user-avatar" style="background: var(--secondary);">SP</div>
            <div>
                <div style="font-weight: 600; font-size: 0.9rem;">Supplier Partner</div>
                <div style="font-size: 0.8rem; color: var(--gray);">CleanPro Supplies Ltd</div>
            </div>
            <button class="logout-btn" onclick="localStorage.removeItem('swisto_user'); location.href='login.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <nav class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-bell"></i> New Requests</a></li>
                <li><a href="#"><i class="fas fa-clipboard-list"></i> My Quotes</a></li>
                <li><a href="#"><i class="fas fa-shipping-fast"></i> Active Deliveries</a></li>
                <li><a href="#"><i class="fas fa-boxes"></i> Inventory</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <h1 style="margin-bottom: 30px;">Supplier Dashboard</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>New Requests</h3>
                    <div class="value" style="color: var(--secondary);">Live</div>
                </div>
                <div class="stat-card">
                    <h3>Active Quotes</h3>
                    <div class="value">8</div>
                </div>
                <div class="stat-card">
                    <h3>Today's Deliveries</h3>
                    <div class="value">3</div>
                </div>
                <div class="stat-card">
                    <h3>Response Rate</h3>
                    <div class="value" style="color: var(--primary-light);">94%</div>
                </div>
            </div>

            <div class="requests-section" id="requestsContainer">
                <h2 class="section-title"><i class="fas fa-bell"></i> Incoming Hotel Requests</h2>
                <p style="color: #94a3b8;">Loading requests...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdZ_tWHds0XjcAzA0XzM2DgejAtK-1YeQ",
            authDomain: "swisto-kenya.firebaseapp.com",
            projectId: "swisto-kenya",
            storageBucket: "swisto-kenya.firebasestorage.app",
            messagingSenderId: "328714398565",
            appId: "1:328714398565:web:1fb61ec84d64e774ad4f8c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const user = JSON.parse(localStorage.getItem('swisto_user'));
        if(!user || user.role !== 'supplier') window.location.href = 'login.html';

        window.submitQuote = async function(orderId) {
            const price = prompt("Enter your quote price in KSh:");
            if (!price) return;

            const orderRef = doc(db, "orders", orderId);
            await updateDoc(orderRef, {
                status: "quoted",
                quotePrice: price,
                supplierEmail: user.email
            });
            
            alert("Quote submitted successfully!");
            window.location.reload();
        }

        async function loadRequests() {
            const querySnapshot = await getDocs(collection(db, "orders"));
            const container = document.getElementById('requestsContainer');
            
            container.innerHTML = `<h2 class="section-title"><i class="fas fa-bell"></i> Incoming Hotel Requests</h2>`;
            
            let hasRequests = false;
            querySnapshot.forEach((doc) => {
                const order = doc.data();
                // Only show orders that haven't been quoted yet
                if (order.status === "pending") {
                    hasRequests = true;
                    container.innerHTML += `
                        <div class="request-card">
                            <div class="order-header">
                                <div class="order-id">Request #${doc.id.slice(-5)}</div>
                                <div class="status-urgent">PENDING</div>
                            </div>
                            <p><strong>Items Needed:</strong> ${order.items}</p>
                            <button class="btn btn-primary" onclick="submitQuote('${doc.id}')" style="margin-top: 10px;">Submit Quote</button>
                        </div>
                    `;
                }
            });

            if(!hasRequests) {
                container.innerHTML += `<p style="color: #94a3b8;">No pending requests right now. Waiting for hotels to submit orders...</p>`;
            }
        }
        
        loadRequests();
    </script>
</body>
</html>
