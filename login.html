<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SWISTO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f3f4f6;">
    
    <div class="login-wrapper">
        <!-- Left Side -->
        <div class="login-hero">
            <img src="swisto-logo.png" alt="SWISTO Logo">
            <h1>Transform Your Emergency Procurement</h1>
            <p style="margin-top: 15px; opacity: 0.9;">Access your dashboard to manage emergency supplies and track deliveries.</p>
        </div>

        <!-- Right Side -->
        <div class="login-form-container">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="color: var(--primary);">Welcome Back</h2>
                <p style="color: var(--gray);">Sign in to your SWISTO dashboard</p>
            </div>

            <div class="user-type-selector">
                <div class="user-type-btn active" data-type="hotel">
                    <i class="fas fa-hotel"></i>
                    <span>Hotel Manager</span>
                </div>
                <div class="user-type-btn" data-type="supplier">
                    <i class="fas fa-truck"></i>
                    <span>Supplier</span>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div class="demo-accounts">
                <h3 style="font-size: 1rem; margin-bottom: 15px; text-align: center; color: var(--gray);">Quick Demo Access (Fill only)</h3>
                <div class="demo-account" data-email="hotel@test.com" data-password="password123" data-type="hotel">
                    <strong>Hotel Manager Demo</strong>
                </div>
                <div class="demo-account" data-email="supplier@test.com" data-password="password123" data-type="supplier">
                    <strong>Supplier Demo</strong>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: var(--gray); text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- The module type is critical for Firebase to work -->
    <script type="module" src="script.js"></script>
</body>
</html>
